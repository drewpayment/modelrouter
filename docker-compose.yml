# The litellm proxy plus its Postgres (Admin UI, virtual keys, spend tracking).
# Start with: docker compose --env-file .env up -d --build
#
# oMLX stays on the host (it needs Apple Silicon / Metal); the proxy reaches it
# through host.docker.internal.
services:
  litellm:
    build: .
    image: modelrouter-litellm
    container_name: modelrouter-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Override the .env values, which are written for native (host) runs.
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/litellm
      OMLX_API_BASE: ${OMLX_API_BASE_DOCKER:-http://host.docker.internal:8000/v1}
      # Resend email
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      # PROXY_BASE_URL is deliberately NOT set. It is a single global override
      # that pins the Admin UI's API base to one address; every other address
      # then serves a UI whose data calls point somewhere else. Left unset, the
      # UI derives its base from window.location.origin, so localhost, the LAN
      # IP and the *.orb.local domain all work at once, and nothing breaks when
      # DHCP moves the LAN IP. Emailed invite/alert links fall back to the base
      # URL of the request that triggered them - so send invites from the
      # address the recipient can reach. Set this only behind a stable public
      # hostname / reverse proxy.
      # PROXY_BASE_URL: ${PROXY_BASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # All interfaces: reachable from other machines on the LAN.
      # The master key is the only gate - mint per-device virtual keys in the
      # Admin UI rather than handing the master key out. Postgres below stays
      # on 127.0.0.1 deliberately; no client needs the database directly.
      - "4000:4000"
    volumes:
      # Live config edits: `docker compose restart litellm` picks them up.
      - ./config.yaml:/app/config.yaml:ro
      # Custom provider handlers config.yaml imports (providers.jev); must
      # sit next to config.yaml. Restart after editing, like config.yaml.
      - ./providers:/app/providers:ro
      # GitHub Copilot device-flow tokens, shared with native runs.
      - ${HOME}/.config/litellm/github_copilot:/root/.config/litellm/github_copilot
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  postgres:
    image: postgres:16
    container_name: modelrouter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: litellm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
