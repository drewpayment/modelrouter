# Postgres for the LiteLLM Admin UI, virtual keys, and spend tracking.
# Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: modelrouter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: litellm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
