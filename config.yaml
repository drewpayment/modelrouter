# LiteLLM proxy config — routes between local oMLX (Apple Silicon) and GitHub Copilot.
# Run in Docker: docker compose --env-file .env up -d --build
# Run natively:  uv run --env-file .env litellm --config config.yaml --port 4000
#
# OMLX_API_BASE differs per runtime: 127.0.0.1 natively, host.docker.internal
# from the container (docker-compose.yml sets it).

# Shared oMLX connection settings. Not a litellm key - it is a YAML anchor,
# merged into each local entry below with `<<: *omlx`. litellm ignores unknown
# top-level keys, so this is safe.
x_omlx: &omlx
  api_base: os.environ/OMLX_API_BASE
  api_key: os.environ/OMLX_API_KEY

model_list:
  # ---------- Layer 1: role aliases (the switchboard) ----------
  # These stable names are the ONLY local models the auto-routers, fallbacks
  # and clients should reference. To put a different oMLX model behind a role,
  # change that one `model:` line - nothing downstream moves.
  - model_name: local-fast # classifier + SIMPLE tier; MoE, 3B active, MTP
    litellm_params:
      <<: *omlx
      # Ornith matches Qwen3.6-35B-A3B's answers at the same throughput
      # (~101 vs ~104 tok/s) while spending 2.5-6x fewer tokens to get there.
      model: openai/Ornith-1.5-35B-A3B-oQ6e-mtp

  - model_name: local-balanced # MEDIUM tier; the everyday workhorse
    litellm_params:
      <<: *omlx
      # Dense 27B at 4-bit: slower than the 35B-A3B MoE but stronger on
      # mid-difficulty work. local-deep keeps the 8-bit build of the same model.
      model: openai/Qwen3.8-27B-oQ4e-mtp

  - model_name: local-deep # strongest local; COMPLEX tier when staying offline
    litellm_params:
      <<: *omlx
      model: openai/Qwen3.8-27B-oQ8e-mtp

  # Default local alias kept for clients that hardcode it. Falls back to
  # Copilot if oMLX is down (see router_settings below).
  - model_name: local-model
    litellm_params:
      <<: *omlx
      model: openai/Qwen3.6-35B-A3B-oQ6-fp16-mtp

  # ---------- Layer 2: raw oMLX IDs (escape hatch) ----------
  # Address a specific weight file directly, bypassing the roles above.
  # Must match the IDs oMLX serves (GET http://127.0.0.1:8000/v1/models).
  - model_name: Ornith-1.5-35B-A3B-oQ6e-mtp
    litellm_params:
      <<: *omlx
      model: openai/Ornith-1.5-35B-A3B-oQ6e-mtp

  - model_name: Qwen3.6-35B-A3B-MLX-8bit
    litellm_params:
      <<: *omlx
      model: openai/Qwen3.6-35B-A3B-MLX-8bit

  - model_name: Qwen3.6-35B-A3B-oQ6-fp16-mtp
    litellm_params:
      <<: *omlx
      model: openai/Qwen3.6-35B-A3B-oQ6-fp16-mtp

  - model_name: Qwen3.8-27B-8bit
    litellm_params:
      <<: *omlx
      model: openai/Qwen3.8-27B-8bit

  - model_name: Qwen3.8-27B-MLX-8bit
    litellm_params:
      <<: *omlx
      model: openai/Qwen3.8-27B-MLX-8bit

  - model_name: Qwen3.8-27B-oQ4e-mtp
    litellm_params:
      <<: *omlx
      model: openai/Qwen3.8-27B-oQ4e-mtp

  - model_name: Qwen3.8-27B-oQ8e-mtp
    litellm_params:
      <<: *omlx
      model: openai/Qwen3.8-27B-oQ8e-mtp

  # Local embeddings (used by the Auto Router for prompt classification)
  - model_name: local-embeddings
    litellm_params:
      <<: *omlx
      model: openai/Qwen3-Embedding-0.6B-4bit-DWQ
    model_info:
      mode: embedding

  # ---------- GitHub Copilot ----------
  # Auth: run `uv run python scripts/copilot_auth.py` once (device flow).
  #
  # Frontier models pinned explicitly so they appear in /v1/models and the
  # Admin UI: litellm's wildcard expansion uses its bundled (stale) registry,
  # not Copilot's live /models endpoint. See README for listing live models.
  # Copilot bills by subscription, not per token. The costs below are the
  # providers' direct-API list prices (per token), so the Cost tab shows what
  # this usage would cost via direct APIs. Wildcard requests still record $0.
  - model_name: copilot-gpt-4.1
    litellm_params:
      model: github_copilot/gpt-4.1
      input_cost_per_token: 0.000002 # $2/M (OpenAI list)
      output_cost_per_token: 0.000008 # $8/M

  - model_name: copilot-claude-fable-5
    litellm_params:
      model: github_copilot/claude-fable-5
      input_cost_per_token: 0.00001 # $10/M (Anthropic list)
      output_cost_per_token: 0.00005 # $50/M

  - model_name: copilot-claude-opus-5
    litellm_params:
      model: github_copilot/claude-opus-5
      input_cost_per_token: 0.000005 # $5/M
      output_cost_per_token: 0.000025 # $25/M

  - model_name: copilot-claude-sonnet-5
    litellm_params:
      model: github_copilot/claude-sonnet-5
      input_cost_per_token: 0.000003 # $3/M
      output_cost_per_token: 0.000015 # $15/M

  - model_name: copilot-claude-haiku-4.5
    litellm_params:
      model: github_copilot/claude-haiku-4.5
      input_cost_per_token: 0.000001 # $1/M
      output_cost_per_token: 0.000005 # $5/M

  - model_name: copilot-gpt-5.5
    litellm_params:
      model: github_copilot/gpt-5.5
      input_cost_per_token: 0.000005 # $5/M (OpenAI list)
      output_cost_per_token: 0.00003 # $30/M

  - model_name: copilot-gemini-3.1-pro
    litellm_params:
      model: github_copilot/gemini-3.1-pro-preview
      input_cost_per_token: 0.000002 # $2/M (Google list, <=200K prompts)
      output_cost_per_token: 0.000012 # $12/M

  - model_name: copilot-claude-opus-5.5 # smart_router_hybrid's REASONING tier
    litellm_params:
      model: github_copilot/claude-opus-5.5
      input_cost_per_token: 0.000004 # $4/M (Anthropic list)
      output_cost_per_token: 0.00002 # $20/M

  # Wildcard passthrough: request any "github_copilot/<model>" directly.
  - model_name: "github_copilot/*"
    litellm_params:
      model: "github_copilot/*"

  # ---------- Vercel AI Gateway ----------
  # One AI_GATEWAY_API_KEY covers both entries; billed through the gateway.
  - model_name: vercel-deepseek-v4.1-flash # smart_router_hybrid's COMPLEX tier
    litellm_params:
      model: vercel_ai_gateway/deepseek/deepseek-v4.1-flash
      api_key: os.environ/AI_GATEWAY_API_KEY
      input_cost_per_token: 0.0000003 # $0.30/M (gateway list)
      output_cost_per_token: 0.0000012 # $1.20/M

  # TypeSafe AI's Jev, an evaluation model - NOT a chat model. The gateway only
  # serves it on /v1/evaluate, so it goes through the `jev` custom provider
  # (providers/jev.py), which answers the complexity router's classifier call
  # and nothing else. Use it only as classifier_llm_config.model.
  - model_name: jev-classifier
    litellm_params:
      model: jev/typesafe-ai/jev
      api_key: os.environ/AI_GATEWAY_API_KEY
      input_cost_per_token: 0.000000042 # $0.042/M (gateway list; output is free)
      output_cost_per_token: 0

litellm_settings:
  # Registers the `jev` provider. The handler path resolves relative to this
  # file, so providers/ must sit next to config.yaml (Dockerfile + compose do).
  custom_provider_map:
    - { "provider": "jev", "custom_handler": "providers.jev.jev_classifier" }
  drop_params: true # strip OpenAI params a backend doesn't support instead of erroring
  success_callback: ["resend_email"] # send emails via Resend

router_settings:
  num_retries: 2
  fallbacks:
    - { "local-model": ["copilot-gpt-4.1"] }

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Allow models/routers added in the Admin UI to be saved to Postgres
  store_model_in_db: true
  alerting: ['email'] # trigger email notifications (key created, user invited, budget alerts)
